<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Capitaine Banane</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1dfae;--card:#fff7dc;--fg:#4a2a12;--y:#ffd21f;--r:#d9381e;--n:#6b3e1e;--g:#2f7a3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1b0e;--card:#4a2f17;--fg:#fff1c9;--n:#d99a3a}}
:root[data-theme="dark"]{--bg:#2a1b0e;--card:#4a2f17;--fg:#fff1c9;--n:#d99a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg) radial-gradient(circle at 15% 8%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle at 85% 92%,rgba(47,122,59,.18),transparent 55%);color:var(--fg);font:500 19px/1.35 "Baloo 2",system-ui,sans-serif;min-height:100vh;-webkit-user-select:none;user-select:none}
#top{display:flex;gap:10px;align-items:center;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
#top img{width:84px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
#bub{background:var(--card);border:3px solid var(--n);border-radius:18px;padding:8px 12px;flex:1;font-size:17px}
#main{padding:8px 14px 90px;max-width:640px;margin:auto;text-align:center}
h1,h2{font-weight:800;margin:6px 0;color:var(--g)}@media (prefers-color-scheme:dark){h1,h2{color:var(--y)}}
.btn{font:800 21px "Baloo 2",system-ui;background:var(--y);color:#3b2210;border:3px solid #5a3418;border-radius:18px;padding:10px 20px;margin:6px;box-shadow:0 5px 0 #5a3418;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a3418}.btn:focus-visible,.o:focus-visible{outline:4px solid var(--r)}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;text-align:left;border:3px solid var(--n)}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.lv.lock{opacity:.55}
.q{font-size:30px;font-weight:800;margin:10px 0}.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.o{font-size:56px;background:var(--card);border:4px solid var(--n);border-radius:22px;width:96px;height:96px;cursor:pointer}
.o.bad{opacity:.25;pointer-events:none}.o.good{background:#7be07b;animation:hop .5s 3}
@keyframes hop{50%{transform:translateY(-14px) scale(1.1)}}
.bl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.b{width:62px;height:76px;border-radius:50% 50% 48% 48%;border:0;cursor:pointer;animation:fl 2s ease-in-out infinite alternate;box-shadow:inset -8px -8px 0 rgba(0,0,0,.15)}
@keyframes fl{to{transform:translateY(-9px)}}
.mz{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;max-width:330px;margin:8px auto}.mz div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:26px;background:var(--card)}.mz .w{background:var(--n)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center}.pad .btn{margin:0;padding:6px}
.fd{position:relative;height:300px;background:var(--card);border:3px solid var(--n);border-radius:20px;overflow:hidden}.fd span{position:absolute;font-size:36px;cursor:pointer}.fd .f{opacity:.3;pointer-events:none}
.tr{position:relative;height:70px;background:#555;border-radius:14px;margin:10px 0;overflow:hidden}.tr span{position:absolute;top:12px;font-size:40px;transition:left .15s}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;background:var(--bg);z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,20,50,.85);z-index:20;display:grid;place-items:center;padding:20px}.ov .card{max-width:420px;text-align:center}
input{font:800 24px "Baloo 2",system-ui;width:100%;padding:8px;border-radius:12px;border:3px solid var(--n);text-align:center}
.fx{position:fixed;top:-40px;font-size:34px;z-index:30;pointer-events:none;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.chest{font-size:110px;cursor:pointer;animation:hop 1.4s infinite}.bn{position:fixed;font-size:44px;z-index:3;pointer-events:none;animation:fly var(--d) linear infinite alternate}
@keyframes fly{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.b,.o.good{animation:none}}
.o.t{font-size:21px;width:auto;min-width:96px;padding:0 14px;height:72px}.o.m{width:74px;height:74px;font-size:38px}.b.pop{animation:pop .3s forwards}.bm{position:fixed;font-size:50px;z-index:30;pointer-events:none;animation:pop .5s forwards}@keyframes pop{40%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.pt{position:fixed;font-size:34px;z-index:40;pointer-events:none;animation:shoot 2.4s ease-out forwards}@keyframes shoot{0%{transform:translate(0,0) scale(.3);opacity:1}55%{transform:translate(var(--tx),var(--ty)) scale(1.3);opacity:1}100%{transform:translate(var(--tx2),var(--ty2)) rotate(var(--r));opacity:0}}
</style></head><body>

function genMaze(w,h){const W=2*w+1,H=2*h+1,g=Array.from({length:H},()=>Array(W).fill('#')),st=[[0,0]],vis=new Set(['0,0']);g[1][1]='.';

g[1][1]='S';g[H-2][W-2]='E';return g}
